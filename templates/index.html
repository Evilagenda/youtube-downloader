<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background: #ff0000; color: white; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .spinner { display: none; width: 18px; height: 18px; border: 3px solid white; border-top: 3px solid transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #resultContainer { display: none; margin-top: 15px; }
        img { width: 100%; border-radius: 8px; }
        .dl-btn { background: #10b981; color: white; text-decoration: none; display: block; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>YouTube Downloader</h2>
        <input type="text" id="videoUrl" placeholder="Paste YouTube link here...">
        
        <select id="formatType">
            <option value="video">Video (MP4)</option>
            <option value="audio">Audio Only (MP3)</option>
        </select>

        <button id="fetchBtn" onclick="fetchMedia()">
            <div id="spinner" class="spinner"></div>
            <span id="btnText">Fetch Link</span>
        </button>

        <div id="error" style="color: red; margin-top: 10px;"></div>

        <div id="resultContainer">
            <img id="thumb" src="" alt="Thumbnail">
            <p id="videoTitle" style="font-weight: bold; margin: 10px 0;"></p>
            <a id="downloadLink" class="dl-btn" href="#" target="_blank">Download File</a>
        </div>
    </div>

    <script>
        async function fetchMedia() {
            const url = document.getElementById('videoUrl').value.trim();
            const format = document.getElementById('formatType').value;
            const errorDiv = document.getElementById('error');
            const resultContainer = document.getElementById('resultContainer');
            const fetchBtn = document.getElementById('fetchBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');

            errorDiv.innerText = '';
            resultContainer.style.display = 'none';

            if (!url) {
                errorDiv.innerText = 'Please enter a video link.';
                return;
            }

            // Start Loading State
            fetchBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'Fetching...';

            try {
                const response = await fetch('/api/fetch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, format: format })
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('thumb').src = result.data.thumbnail;
                    document.getElementById('videoTitle').innerText = result.data.title;
                    document.getElementById('downloadLink').href = result.data.download_url;
                    resultContainer.style.display = 'block';
                } else {
                    errorDiv.innerText = result.error || 'Failed to fetch media.';
                }
            } catch (err) {
                errorDiv.innerText = 'Error connecting to server.';
            } finally {
                // Reset Button State
                fetchBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = 'Fetch Link';
            }
        }
    </script>
</body>
</html>
